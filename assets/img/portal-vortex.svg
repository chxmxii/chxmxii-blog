<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <filter id="swirl" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="3" seed="7" result="noise"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="70" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
    </filter>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#123807"></stop>
      <stop offset="55%" stop-color="#3f8f18"></stop>
      <stop offset="80%" stop-color="#79d62c"></stop>
      <stop offset="100%" stop-color="#c8ffa0"></stop>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8fe637" stop-opacity="0.55"></stop>
      <stop offset="100%" stop-color="#8fe637" stop-opacity="0"></stop>
    </radialGradient>
  </defs>

  <rect width="800" height="800" fill="#040a02"></rect>
  <circle cx="400" cy="400" r="340" fill="url(#glow)"></circle>

  <g filter="url(#swirl)">
    <circle cx="400" cy="400" r="260" fill="url(#core)"></circle>
    <circle cx="400" cy="400" r="205" fill="none" stroke="#e9ffca" stroke-opacity="0.35" stroke-width="10"></circle>
    <circle cx="400" cy="400" r="150" fill="none" stroke="#123807" stroke-opacity="0.55" stroke-width="26"></circle>
    <circle cx="400" cy="400" r="95" fill="none" stroke="#1f5c0d" stroke-opacity="0.6" stroke-width="34"></circle>
    <circle cx="400" cy="400" r="40" fill="#0a1f04"></circle>
  </g>

  <g fill="#eafccf" opacity="0.8">
    <circle cx="290" cy="220" r="4"></circle>
    <circle cx="520" cy="260" r="3"></circle>
    <circle cx="565" cy="420" r="5"></circle>
    <circle cx="480" cy="560" r="3"></circle>
    <circle cx="300" cy="580" r="4"></circle>
    <circle cx="235" cy="440" r="3"></circle>
    <circle cx="400" cy="180" r="3"></circle>
    <circle cx="610" cy="330" r="3"></circle>
  </g>
</svg>
